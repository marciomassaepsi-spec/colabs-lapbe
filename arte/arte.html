<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1200px;background:#0a0f1e;font-family:Lato,sans-serif;color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;width:1300px;height:1300px;right:-450px;top:-450px;background:radial-gradient(circle,#2a5be8 0%,rgba(29,78,216,.35) 40%,transparent 70%)}
.bar{position:absolute;left:0;top:0;bottom:0;width:22px;background:#1d4ed8}
.wrap{position:absolute;inset:0;padding:100px 110px 90px 130px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:36px}
.top img{width:210px;filter:drop-shadow(0 10px 40px rgba(29,78,216,.7))}
.eyebrow{font:600 30px Poppins;letter-spacing:.22em;text-transform:uppercase;color:#9db8ff}
.sub{font-size:28px;color:#b6c3e6;margin-top:8px}
h1{font:800 124px/1.02 Poppins;margin-top:70px;letter-spacing:-.02em}
h1 span{color:#5b8bff}
p.lead{font-size:44px;line-height:1.35;color:#d6e0fb;margin-top:36px;max-width:1150px}
.steps{display:flex;gap:24px;margin-top:auto}
.step{flex:1;background:#fff;color:#0a0f1e;border-radius:28px;padding:30px 30px 34px}
.step b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#1d4ed8;color:#fff;font:700 32px Poppins;margin-bottom:18px}
.step div{font:600 32px/1.25 Poppins}
</style></head><body>
<div class="glow"></div><div class="bar"></div>
<div class="wrap">
  <div class="top"><img src="logo.png" alt="">
    <div><div class="eyebrow">LAPBE · Férias</div><div class="sub">Liga Acadêmica de Psicologia Baseada em Evidências</div></div></div>
  <h1>Colabs no<br><span>Instagram</span></h1>
  <p class="lead">Escreva roteiros, a diretoria cuida da arte e da edição. Candidate-se!</p>
  <div class="steps">
    <div class="step"><b>1</b><div>Preencha o formulário</div></div>
    <div class="step"><b>2</b><div>Gere o seu PDF</div></div>
    <div class="step"><b>3</b><div>Anexe no Drive da liga</div></div>
  </div>
</div></body></html>
